<text x="84" y="531" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#475569">Đổi trạng thái → đổi tập được bán</text>
<text x="84" y="558" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#475569">Đổi hạng/tỉnh → nguồn cho SCD</text>
<text x="84" y="625" font-family="Lato, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#7c3aed">SEL / CAT / MGR • chỉ số Tiki là snapshot</text>
