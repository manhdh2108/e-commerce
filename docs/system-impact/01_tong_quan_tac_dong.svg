<text x="60" y="48" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#64748b">E-COMMERCE  /  SYSTEM IMPACT ATLAS  /  01</text>
<text x="60" y="105" font-family="Lato, DejaVu Sans, sans-serif" font-size="38" font-weight="900" fill="#10243b">Một thay đổi đi xa đến đâu?</text>
<text x="60" y="144" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#475569">Sáu miền nghiệp vụ • điều kiện bán → giao dịch → hàng &amp; tiền → dữ liệu phân tích</text>
<rect x="60" y="170" width="1680" height="52" rx="12" fill="#fff7ed" stroke="#fed7aa" />
<text x="80" y="202" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#9a4c11">ĐỌC ĐÚNG PHẠM VI: source mock còn conflict; sơ đồ là đối chiếu logic, không phải xác nhận runtime.</text>
<rect x="60" y="250" width="1680" height="115" rx="18" fill="#eaf0f9" stroke="#d8e3f3" />
<text x="85" y="284" font-family="Lato, DejaVu Sans, sans-serif" font-size="15" font-weight="800" fill="#52647e">NGUỒN &amp; ĐIỀU KHIỂN</text>
<text x="85" y="319" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#233b5b">Tiki → SQLite → Đồng bộ chủ động → Chỉ thêm catalog mới</text>
<text x="85" y="345" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#475569">Rule 01–02: không tự tạo tồn/đơn  •  Rule 07: config → preview → job snapshot  •  Rule 04–05: quota hoặc theo đầu vào</text>
